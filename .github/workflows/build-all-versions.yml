name: Build All STM32CubeCLT Versions

on:
  push:
    branches: [main]
    paths:
      - 'Dockerfile'
      - 'entrypoint.sh'
  workflow_dispatch:
    inputs:
      versions:
        description: 'Versions to build (JSON array, leave empty for auto-detect)'
        required: false
        default: ''
      push_to_registry:
        description: 'Push to Docker Hub'
        type: boolean
        required: false
        default: true
      existing_versions_only:
        description: 'Rebuild only currently published versions; require a rollback digest before overwrite'
        type: boolean
        default: false
      force_rebuild:
        description: 'Rebuild all selected versions even if they exist on Docker Hub'
        type: boolean
        required: false
        default: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  detect-versions:
    runs-on: ubuntu-latest
    outputs:
      versions: ${{ steps.parse.outputs.versions }}
      build_versions: ${{ steps.parse.outputs.build_versions }}
      latest_version: ${{ steps.parse.outputs.latest_version }}
      has_versions: ${{ steps.parse.outputs.has_versions }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node.js
        if: github.event.inputs.versions == ''
        uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Install scraper dependencies
        if: github.event.inputs.versions == ''
        run: npm ci --prefix .github/scripts

      - name: Parse STM32CubeCLT versions
        id: parse
        run: |
          # Use manual input if provided
          if [ -n "${{ github.event.inputs.versions }}" ]; then
            VERSIONS='${{ github.event.inputs.versions }}'
          else
            VERSIONS=$(bash .github/scripts/parse-versions.sh)
          fi

          # All versions (for documentation)
          DELIMITER=$(openssl rand -hex 8)
          { echo "versions<<${DELIMITER}"; echo "${VERSIONS}"; echo "${DELIMITER}"; } >> $GITHUB_OUTPUT

          # Linux-supported versions, sorted oldest-first
          ALL_VERSIONS=$(printf '%s' "$VERSIONS" | jq -c             '[.[] | select(.linux_supported == true)] | sort_by([.major, .minor, .patch] | map(tonumber))')
          LATEST=$(printf '%s' "$ALL_VERSIONS" | jq -r '.[-1].version // empty')
          if [ -z "$LATEST" ]; then
            echo "::error::No Linux-supported STM32CubeCLT versions were discovered."
            exit 1
          fi

          # Explicitly selected versions should be built for diagnostic reruns.
          if [ "${{ github.event.inputs.existing_versions_only }}" = "true" ]; then
            EXISTING_TAGS=$(python3 .github/scripts/registry-tags.py uoohyo/stm32-cmake 3 --all)
            BUILD_VERSIONS=$(printf '%s' "$ALL_VERSIONS" | jq -c --argjson tags "$EXISTING_TAGS" \
              '[.[] | select(.version as $v | ($tags | index($v)) != null)]')
            echo "Rebuilding existing versions only; undistributed versions are excluded"
          elif [ -n "${{ github.event.inputs.versions }}" ] || [ "${{ github.event.inputs.force_rebuild }}" = "true" ]; then
            BUILD_VERSIONS="$ALL_VERSIONS"
            echo "Explicit build selection / force_rebuild: rebuilding selected versions"
          else
            # Fail on registry errors rather than inadvertently rebuilding all versions.
            TAGS_FILE=$(mktemp)
            NEXT_URL="https://hub.docker.com/v2/repositories/uoohyo/stm32-cmake/tags?page_size=100"
            while [ -n "$NEXT_URL" ]; do
              RESPONSE=$(curl -fsSL --retry 3 --retry-delay 2 "$NEXT_URL")
              printf '%s' "$RESPONSE" | jq -e '.results | type == "array"' > /dev/null
              printf '%s' "$RESPONSE" | jq -r '.results[].name'                 | grep -E '^[0-9]+\.[0-9]+\.[0-9]+$' >> "$TAGS_FILE" || true
              NEXT_URL=$(printf '%s' "$RESPONSE" | jq -r '.next // empty')
            done
            TAGS_JSON=$(sort -u "$TAGS_FILE" | jq -R -s -c 'split("\n") | map(select(length > 0))')
            rm -f "$TAGS_FILE"
            BUILD_VERSIONS=$(printf '%s' "$ALL_VERSIONS" | jq -c --argjson tags "$TAGS_JSON"               '[.[] | select(.version as $v | ($tags | index($v)) == null)]')
            echo "Registry contains $(printf '%s' "$TAGS_JSON" | jq 'length') released versions"
          fi

          DELIMITER2=$(openssl rand -hex 8)
          { echo "build_versions<<${DELIMITER2}"; echo "${BUILD_VERSIONS}"; echo "${DELIMITER2}"; } >> "$GITHUB_OUTPUT"
          echo "latest_version=${LATEST}" >> "$GITHUB_OUTPUT"
          COUNT=$(printf '%s' "$BUILD_VERSIONS" | jq 'length')
          if [ "$COUNT" -eq 0 ]; then
            echo "has_versions=false" >> "$GITHUB_OUTPUT"
            echo "All versions already exist: skipping installer downloads and builds."
          else
            echo "has_versions=true" >> "$GITHUB_OUTPUT"
          fi
          echo "Linux-supported total: $(printf '%s' "$ALL_VERSIONS" | jq 'length'); to build: $COUNT"

  download-installers:
    needs: detect-versions
    if: needs.detect-versions.outputs.has_versions == 'true'
    runs-on: self-hosted
    timeout-minutes: 30  # Explicit timeout to handle large files (prevent 20-min runner timeout)
    strategy:
      max-parallel: 3  # Optimal for self-hosted runner to avoid timeout while maintaining throughput
      matrix:
        version_info: ${{ fromJson(needs.detect-versions.outputs.build_versions) }}
      fail-fast: false
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node.js for downloader
        uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Install scraper/downloader dependencies
        run: npm ci --prefix .github/scripts

      - name: Download STM32CubeCLT installer
        env:
          CUBECLT_VERSION: ${{ matrix.version_info.version }}
          ST_USERNAME: ${{ secrets.ST_USERNAME }}
          ST_PASSWORD: ${{ secrets.ST_PASSWORD }}
          CUBECLT_INSTALLER_CACHE_DIR: ${{ vars.CUBECLT_INSTALLER_CACHE_DIR }}
          OUTPUT_DIR: cubeclt_download
        run: |
          set -euo pipefail
          mkdir -p cubeclt_download

          # Optional self-hosted runner cache populated via ST's official
          # authenticated download page. It avoids browser login fragility.
          if [ -n "${CUBECLT_INSTALLER_CACHE_DIR:-}" ]; then
            CACHE_FILE="${CUBECLT_INSTALLER_CACHE_DIR}/${CUBECLT_VERSION}/stm32cubeclt_${CUBECLT_VERSION}-Lin-x86_64.sh.zip"
            if [ -f "$CACHE_FILE" ]; then
              echo "Using licensed STM32CubeCLT installer from runner cache"
              unzip -t "$CACHE_FILE" >/dev/null
              cp "$CACHE_FILE" cubeclt_download/
              exit 0
            fi
            echo "Cache miss for STM32CubeCLT $CUBECLT_VERSION"
          fi

          if [ -z "$ST_USERNAME" ] || [ -z "$ST_PASSWORD" ]; then
            echo "::error::No cached installer and ST_USERNAME/ST_PASSWORD are missing."
            exit 1
          fi
          node .github/scripts/download-cubeclt.js

      - name: Upload installer artifact
        uses: actions/upload-artifact@v7
        with:
          name: cubeclt-installer-${{ matrix.version_info.version }}
          path: cubeclt_download/*.zip
          retention-days: 1

  build:
    needs: [detect-versions, download-installers]
    # Each version consumes its own installer artifact; one download failure must not block others.
    if: ${{ always() && !cancelled() && needs.detect-versions.result == 'success' && needs.detect-versions.outputs.has_versions == 'true' }}
    runs-on: ubuntu-latest
    strategy:
      max-parallel: 10  # Parallel builds (from docker-ccstudio-ide optimization)
      matrix:
        version_info: ${{ fromJson(needs.detect-versions.outputs.build_versions) }}
      fail-fast: false
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Download installer artifact
        uses: actions/download-artifact@v8
        with:
          name: cubeclt-installer-${{ matrix.version_info.version }}
          path: cubeclt_download

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          load: true
          provenance: false  # Disable provenance (docker-ccstudio-ide fix for Docker Hub 400 errors)
          build-args: |
            CUBECLT_VERSION=${{ matrix.version_info.version }}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
          tags: |
            uoohyo/stm32-cmake:${{ matrix.version_info.version }}
          cache-from: type=gha,scope=build-${{ matrix.version_info.version }}
          cache-to: type=gha,mode=max,scope=build-${{ matrix.version_info.version }}
          platforms: linux/amd64

      - name: Test required tools in the built image
        run: |
          docker run --rm --entrypoint bash \
            -v "$PWD/.github/scripts/smoke-tools.sh:/tmp/smoke-tools.sh:ro" \
            uoohyo/stm32-cmake:${{ matrix.version_info.version }} /tmp/smoke-tools.sh

      # Publish only this matrix version after its own build and tests succeed.
      - name: Log in to Docker Hub
        if: github.event.inputs.push_to_registry != 'false'
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Publish the tested image and verify its identity
        if: github.event.inputs.push_to_registry != 'false'
        env:
          REQUIRE_EXISTING_IMAGE: ${{ github.event.inputs.existing_versions_only }}
        run: bash .github/scripts/publish-tested-image.sh 'uoohyo/stm32-cmake:${{ matrix.version_info.version }}' 'published/${{ matrix.version_info.version }}.json'

      - name: Preserve rollback ledger even if publication fails
        if: always() && github.event.inputs.existing_versions_only == 'true' && github.event.inputs.push_to_registry != 'false'
        uses: actions/upload-artifact@v7
        with:
          name: rollback-${{ matrix.version_info.version }}
          path: rollback/*.json
          if-no-files-found: warn
          retention-days: 90

      - name: Record successful publication
        if: github.event.inputs.push_to_registry != 'false'
        uses: actions/upload-artifact@v7
        with:
          name: published-${{ matrix.version_info.version }}
          path: published/*.json
          if-no-files-found: error
          retention-days: 7

  tag-latest:
    needs: [detect-versions, build]
    runs-on: ubuntu-latest
    # Successful siblings may publish even if another matrix version fails.
    if: ${{ always() && !cancelled() && needs.detect-versions.result == 'success' && needs.detect-versions.outputs.has_versions == 'true' && github.event.inputs.push_to_registry != 'false' }}
    steps:
      - uses: actions/checkout@v5

      - name: Download verified publication receipts
        uses: actions/download-artifact@v8
        with:
          pattern: published-*
          path: published
          merge-multiple: true

      - name: Require at least one successful publication
        run: |
          shopt -s nullglob
          receipts=(published/*.json)
          [ "${#receipts[@]}" -gt 0 ] || { echo 'No verified publication; latest is unchanged'; exit 1; }
          for receipt in "${receipts[@]}"; do
            jq -e '.repository_digest and .image_id and .source_revision' "$receipt" >/dev/null
          done

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Tag and push latest from verified registry state
        env:
          ATTEMPTED_VERSIONS: ${{ needs.detect-versions.outputs.build_versions }}
          EXPECTED_REVISION: ${{ github.sha }}
        run: |
          set -euo pipefail
          # Never include merely discovered or failed versions in this selection.
          SOURCE_REF=$(python3 .github/scripts/select-latest.py uoohyo/stm32-cmake 3 published)
          docker pull "$SOURCE_REF"
          EXPECTED_ID=$(docker image inspect --format '{{.Id}}' "$SOURCE_REF")
          docker tag "$SOURCE_REF" uoohyo/stm32-cmake:latest
          docker push uoohyo/stm32-cmake:latest
          docker pull uoohyo/stm32-cmake:latest
          ACTUAL_ID=$(docker image inspect --format '{{.Id}}' uoohyo/stm32-cmake:latest)
          [ "$EXPECTED_ID" = "$ACTUAL_ID" ]
          echo "latest_source=$SOURCE_REF image_id=$EXPECTED_ID" >> "$GITHUB_STEP_SUMMARY"

  handle-failure:
    needs: [detect-versions, build, tag-latest]
    runs-on: ubuntu-latest
    if: failure() && !cancelled()
    permissions:
      issues: write
    steps:
      - name: Mark building issue as failed
        uses: actions/github-script@v9
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            // Find open issues with "building" label
            const issues = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'building'
            });

            if (issues.data.length === 0) {
              console.log('No building issues found');
              return;
            }

            // Process each building issue
            for (const issue of issues.data) {
              console.log(`Marking issue #${issue.number} as failed`);

              // Add failure comment
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                body: `❌ **Build failed**\n\nSome versions failed to build. Please check the [workflow run](https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}) for details.\n\n**Common issues:**\n- ST credentials expired or invalid\n- Version not available on ST website\n- Network timeout\n\nThis issue will remain open for investigation.`
              });

              // Add "failed" label
              await github.rest.issues.addLabels({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                labels: ['failed']
              });

              // Remove "building" label
              await github.rest.issues.removeLabel({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                name: 'building'
              });

              console.log(`Issue #${issue.number} marked as failed`);
            }
