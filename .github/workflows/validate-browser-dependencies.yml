name: Validate browser dependencies

on:
  pull_request:
    paths:
      - '.github/scripts/package*.json'
      - '.github/scripts/install-browser.sh'
      - '.github/scripts/*cubeclt*.js'
      - 'tests/test_browser_compatibility.cjs'
      - '.github/workflows/validate-browser-dependencies.yml'
  push:
    branches: [main]
    paths:
      - '.github/scripts/package*.json'
      - '.github/scripts/install-browser.sh'
      - 'tests/test_browser_compatibility.cjs'
      - '.github/workflows/validate-browser-dependencies.yml'

permissions:
  contents: read

jobs:
  compatibility:
    runs-on: ${{ matrix.os }}
    env:
      PUPPETEER_CACHE_DIR: ${{ runner.temp }}/puppeteer-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}-${{ strategy.job-index }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        node: ['22', '24']
        os: [ubuntu-latest, macos-14]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
      - name: Install the locked browser dependencies
        run: |
          test ! -e "$PUPPETEER_CACHE_DIR"
          bash .github/scripts/install-browser.sh
      - name: Audit runtime dependencies
        run: npm audit --prefix .github/scripts --omit=dev --audit-level=high
      - name: Test browser APIs without ST credentials or vendor downloads
        run: node --test tests/test_browser_compatibility.cjs
