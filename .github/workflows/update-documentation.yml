name: Update Versions Documentation

on:
  workflow_run:
    workflows: ["Build All STM32CubeCLT Versions", "Check for New STM32CubeCLT Version"]
    types: [completed]
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  update-versions:
    runs-on: ubuntu-latest
    if: >-
      ${{ github.event_name == 'workflow_dispatch' ||
          (github.event.workflow_run.head_branch == 'main' &&
           github.event.workflow_run.head_repository.full_name == github.repository) }}
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Install scraper dependencies
        run: npm ci --prefix .github/scripts

      - name: Scrape all STM32CubeCLT versions from ST
        id: scrape
        run: |
          echo "Fetching all versions from ST website..."
          ALL_VERSIONS=$(bash .github/scripts/parse-versions.sh)

          DELIMITER=$(openssl rand -hex 8)
          { echo "versions<<${DELIMITER}"; echo "${ALL_VERSIONS}"; echo "${DELIMITER}"; } >> $GITHUB_OUTPUT
          echo "Total versions: $(echo "$ALL_VERSIONS" | jq '. | length')"
          echo "Linux-supported: $(echo "$ALL_VERSIONS" | jq '[.[] | select(.linux_supported == true)] | length')"

      - name: Fetch Docker Hub versions
        id: fetch-versions
        run: |
          echo "Fetching versions from Docker Hub..."

          set -euo pipefail
          TAGS_FILE=$(mktemp)
          trap 'rm -f "$TAGS_FILE"' EXIT
          NEXT_URL="https://hub.docker.com/v2/repositories/uoohyo/stm32-cmake/tags?page_size=100"
          SEEN_URLS=""
          while [ -n "$NEXT_URL" ]; do
            case "$NEXT_URL" in
              https://hub.docker.com/v2/repositories/uoohyo/stm32-cmake/tags?*) ;;
              *) echo "::error::Unexpected registry pagination URL"; exit 1 ;;
            esac
            if printf '%s\n' "$SEEN_URLS" | grep -Fxq "$NEXT_URL"; then
              echo "::error::Repeated registry pagination URL"; exit 1
            fi
            SEEN_URLS="${SEEN_URLS}"$'\n'"${NEXT_URL}"
            RESPONSE=$(curl -fsSL --retry 3 --retry-delay 2 "$NEXT_URL")
            printf '%s' "$RESPONSE" | jq -e '
              (.results | type == "array") and
              all(.results[]; .name | type == "string") and
              has("next") and (.next == null or (.next | type == "string" and length > 0))' > /dev/null
            printf '%s' "$RESPONSE" | jq -r '.results[].name' >> "$TAGS_FILE"
            NEXT_URL=$(printf '%s' "$RESPONSE" | jq -r '.next // empty')
          done
          TAGS_JSON=$(sort -u "$TAGS_FILE" | jq -R -s -c 'split("\n") | map(select(test("^[0-9]+\\.[0-9]+\\.[0-9]+$")))')
          echo "tags=${TAGS_JSON}" >> "$GITHUB_OUTPUT"
          echo "Docker Hub tags: $(printf '%s' "$TAGS_JSON" | jq 'length')"

      - name: Generate version tables
        env:
          VERSIONS: ${{ steps.scrape.outputs.versions }}
          DOCKER_TAGS: ${{ steps.fetch-versions.outputs.tags }}
        run: |
          set -euo pipefail
          printf '%s\n' "$VERSIONS" > /tmp/discovered-versions.json
          printf '%s\n' "$DOCKER_TAGS" > /tmp/registry-tags.json
          python3 .github/scripts/version-metadata.py render /tmp/discovered-versions.json \
            --tags /tmp/registry-tags.json --output-dir /tmp

      - name: Update versions.md
        run: |
          echo "Updating docs/versions.md..."
          cp docs/template/versions.template.md docs/versions.md
          TABLE=$(cat /tmp/table-full.md)
          TIMESTAMP=$(date -u '+%Y-%m-%d %H:%M:%S UTC')

          awk -v table="$TABLE" -v timestamp="$TIMESTAMP" '
            /<!-- VERSION_TABLE_START -->/ {
              print
              print ""
              print table
              print ""
              skip=1
              next
            }
            /<!-- VERSION_TABLE_END -->/ {
              skip=0
              print
              next
            }
            /<!-- LAST_UPDATE -->/ {
              gsub(/<!-- LAST_UPDATE -->/, timestamp)
            }
            !skip
          ' docs/versions.md > docs/versions.md.tmp

          mv docs/versions.md.tmp docs/versions.md
          echo "versions.md updated successfully"

      - name: Update README.md
        run: |
          echo "Updating README.md..."
          cp docs/template/README.template.md README.md
          TABLE=$(cat /tmp/table-readme.md)

          awk -v table="$TABLE" '
            /<!-- VERSION_TABLE_START -->/ {
              print
              print table
              skip=1
              next
            }
            /<!-- VERSION_TABLE_END -->/ {
              skip=0
              print
              next
            }
            !skip
          ' README.md > README.md.tmp

          mv README.md.tmp README.md
          echo "README.md updated successfully"

      - name: Commit and push
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add README.md docs/versions.md

          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "📝 auto-update README and versions documentation [skip ci]"
            git push
            echo "Documentation updated successfully"
          fi
